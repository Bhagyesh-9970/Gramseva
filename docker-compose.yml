version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_water_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartwater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartwater_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-smartwater_pds}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartwater} -d ${POSTGRES_DB:-smartwater_pds}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart_water_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_water_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartwater:smartwater_pass_2026@db:5432/smartwater_pds
      SECRET_KEY: ${SECRET_KEY:-smart-water-pds-super-secret-key-2026}
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      SIMULATION_MODE: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_water_ui
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
